name: Continuous Integration (ARC05)

on:
  # GitHub cron uses UTC: 03:00 UTC is 03:00 in Lisbon during winter and
  # 04:00 in Lisbon during daylight saving time.
  schedule:
    - cron: '0 3 * * *'

  # Allows one additional, deliberate run when needed.
  workflow_dispatch:

jobs:
  # =========================================================================
  # JOB 1: VALIDAR BACKEND E TESTES (Unit + Integration)
  # =========================================================================
  backend-checks:
    name: Backend Lint, Build & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: laprizza_ci_test
      PGUSER: laprizza_user
      PGPASSWORD: laprizza_password
      PGSSLMODE: disable
      JWT_SECRET: ci_test_secret_key
      RUN_DATABASE_TESTS: '1'

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: laprizza_user
          POSTGRES_PASSWORD: laprizza_password
          POSTGRES_DB: laprizza_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U laprizza_user -d laprizza_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Database Migrations
        run: |
          cd backend
          npm run db:migrate

      - name: Run Unit & Integration Tests with Coverage
        run: |
          cd backend
          npm run test:coverage

  # =========================================================================
  # JOB 2: VALIDAR FRONTEND (React + Vite Build)
  # =========================================================================
  frontend-checks:
    name: Frontend Lint, Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Lint and run frontend tests
        run: |
          npm run lint
          npm test -- --runInBand

      - name: Verify the health contract against the Express API
        env:
          CORS_ORIGIN: http://localhost:5173
        run: |
          npm --prefix ../backend ci
          npm run test:integration

      - name: Build Frontend Application (Vite)
        env:
          VITE_BACKEND_BASE_URL: /api/v1
        run: |
          npm run build
          npm run check:bundle
