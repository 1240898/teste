/var/log/laprizza/deployments/*.log {
    weekly
    rotate 13
    maxage 90
    missingok
    notifempty
    compress
    delaycompress
    dateext
    create 0600 deploy deploy
    su deploy deploy
}

# SYS02: denied-access log written by Nginx (contains client IP addresses).
/var/log/laprizza/access/*.log {
    weekly
    rotate 13
    maxage 90
    missingok
    notifempty
    compress
    delaycompress
    dateext
    copytruncate
}

/var/log/laprizza/shared-resources/access.jsonl {
    weekly
    rotate 13
    maxage 90
    missingok
    notifempty
    compress
    delaycompress
    dateext
    nocreate
}

# SYS08: backup log and restore-drill row counts.
/var/log/laprizza/backup/*.log /var/log/laprizza/backup/*.txt {
    weekly
    rotate 13
    maxage 90
    missingok
    notifempty
    compress
    delaycompress
    dateext
    copytruncate
}

# SYS03: audit log of allowed-networks changes (usernames and diffs).
/var/log/laprizza-access/*.log {
    weekly
    rotate 13
    maxage 90
    missingok
    notifempty
    compress
    delaycompress
    dateext
    copytruncate
}