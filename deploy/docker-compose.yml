name: laprizza

services:
  api:
    image: laprizza-api:${API_IMAGE_TAG:-${RELEASE_SHA:?RELEASE_SHA is required}}
    pull_policy: never
    restart: unless-stopped
    env_file:
      - /etc/laprizza/config/${DEI_CONFIG_REVISION:?DEI_CONFIG_REVISION is required}.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      RELEASE_SHA: ${RELEASE_SHA}
      DEI_CONFIG_REVISION: ${DEI_CONFIG_REVISION}
    expose:
      - "3000"
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      laprizza.release.sha: ${RELEASE_SHA}
      laprizza.config.revision: ${DEI_CONFIG_REVISION}

  web:
    image: laprizza-web:${WEB_IMAGE_TAG:-${RELEASE_SHA:?RELEASE_SHA is required}}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "2228:8080"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      laprizza.release.sha: ${RELEASE_SHA}
      laprizza.config.revision: ${DEI_CONFIG_REVISION}

networks:
  backend:
    name: laprizza-backend
    driver: bridge
