-width:0.5;" width="105" x="800" y="106.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="91" x="807" y="127.752">AuthController</text><rect fill="#E2E2F0" filter="url(#fjt8whjqe394i)" height="31.6094" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="105" x="800" y="670.5078"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="91" x="807" y="692.041">AuthController</text><rect fill="#E2E2F0" filter="url(#fjt8whjqe394i)" height="49.2188" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="165" x="1012" y="88.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="125" x="1032" y="110.1426">Session invalidation</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="151" x="1019" y="127.752">(AA04 - to be designed)</text><rect fill="#E2E2F0" filter="url(#fjt8whjqe394i)" height="49.2188" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="165" x="1012" y="670.5078"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="125" x="1032" y="692.041">Session invalidation</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="151" x="1019" y="709.6504">(AA04 - to be designed)</text><rect fill="#E2E2F0" filter="url(#fjt8whjqe394i)" height="49.2188" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="167" x="1190" y="88.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="153" x="1197" y="110.1426">Google Identity Services</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="101" x="1223" y="127.752">(OIDC Provider)</text><rect fill="#E2E2F0" filter="url(#fjt8whjqe394i)" height="49.2188" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="167" x="1190" y="670.5078"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="153" x="1197" y="692.041">Google Identity Services</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="101" x="1223" y="709.6504">(OIDC Provider)</text><rect fill="#FFFFFF" filter="url(#fjt8whjqe394i)" height="407.2734" style="stroke:#181818;stroke-width:1.0;" width="10" x="259.5" y="174.1797"/><rect fill="#FFFFFF" filter="url(#fjt8whjqe394i)" height="270.5156" style="stroke:#181818;stroke-width:1.0;" width="10" x="534.5" y="220.8828"/><rect fill="#FFFFFF" filter="url(#fjt8whjqe394i)" height="30.3516" style="stroke:#181818;stroke-width:1.0;" width="10" x="726.5" y="251.2344"/><rect fill="#FFFFFF" filter="url(#fjt8whjqe394i)" height="179.4609" style="stroke:#181818;stroke-width:1.0;" width="10" x="849" y="311.9375"/><rect fill="#FFFFFF" filter="url(#fjt8whjqe394i)" height="118.7578" style="stroke:#181818;stroke-width:1.0;" width="10" x="1091" y="342.2891"/><polygon fill="#181818" points="247.5,170.1797,257.5,174.1797,247.5,178.1797,251.5,174.1797" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="80.5" x2="253.5" y1="174.1797" y2="174.1797"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="87.5" y="169.3232">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="91" x="98.5" y="169.3232">clicks "Log out"</text><polygon fill="#181818" points="522.5,216.8828,532.5,220.8828,522.5,224.8828,526.5,220.8828" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="269.5" x2="528.5" y1="220.8828" y2="220.8828"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="276.5" y="207.8506">2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144" x="287.5" y="199.6748">POST /api/v1/auth/logout</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="158" x="287.5" y="216.0264">Authorization: Bearer &lt;jwt&gt;</text><polygon fill="#181818" points="714.5,247.2344,724.5,251.2344,714.5,255.2344,718.5,251.2344" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="544.5" x2="720.5" y1="251.2344" y2="251.2344"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="551.5" y="246.3779">3</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149" x="562.5" y="246.3779">verifyToken(req, res, next)</text><polygon fill="#181818" points="555.5,277.5859,545.5,281.5859,555.5,285.5859,551.5,281.5859" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="549.5" x2="730.5" y1="281.5859" y2="281.5859"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="561.5" y="276.7295">4</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="147" x="572.5" y="276.7295">next()  (req.user resolved)</text><polygon fill="#181818" points="837,307.9375,847,311.9375,837,315.9375,841,311.9375" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="544.5" x2="843" y1="311.9375" y2="311.9375"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="551.5" y="307.0811">5</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="87" x="562.5" y="307.0811">logout(req, res)</text><polygon fill="#181818" points="1079,338.2891,1089,342.2891,1079,346.2891,1083,342.2891" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="859" x2="1085" y1="342.2891" y2="342.2891"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="866" y="337.4326">6</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202" x="877" y="337.4326">end the current application session</text><path d="M1106,355.2891 L1106,430.2891 L1397,430.2891 L1397,365.2891 L1387,355.2891 L1106,355.2891 " fill="#FEFFDD" filter="url(#fjt8whjqe394i)" style="stroke:#181818;stroke-width:0.5;"/><path d="M1387,355.2891 L1387,365.2891 L1397,365.2891 L1387,355.2891 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233" x="1112" y="373.7842">Defined by AA04 (e.g. token revocation /</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246" x="1112" y="390.1357">server-side session removal), so the ended</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270" x="1112" y="406.4873">session cannot be reused. The flow is identical</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263" x="1112" y="422.8389">for local (AA01) and Google (AA02) sessions.</text><polygon fill="#181818" points="870,457.0469,860,461.0469,870,465.0469,866,461.0469" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="864" x2="1095" y1="461.0469" y2="461.0469"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="876" y="456.1904">7</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="14" x="887" y="456.1904">ok</text><polygon fill="#181818" points="280.5,487.3984,270.5,491.3984,280.5,495.3984,276.5,491.3984" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="274.5" x2="853" y1="491.3984" y2="491.3984"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="286.5" y="486.542">8</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90" x="297.5" y="486.542">204 No Content</text><line style="stroke:#181818;stroke-width:1.0;" x1="269.5" x2="311.5" y1="538.1016" y2="538.1016"/><line style="stroke:#181818;stroke-width:1.0;" x1="311.5" x2="311.5" y1="538.1016" y2="551.1016"/><line style="stroke:#181818;stroke-width:1.0;" x1="270.5" x2="311.5" y1="551.1016" y2="551.1016"/><polygon fill="#181818" points="280.5,547.1016,270.5,551.1016,280.5,555.1016,276.5,551.1016" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="276.5" y="525.0693">9</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="240" x="287.5" y="516.8936">discard token and cached protected data;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="83" x="287.5" y="533.2451">reset to Guest</text><polygon fill="#181818" points="91.5,577.4531,81.5,581.4531,91.5,585.4531,87.5,581.4531" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="85.5" x2="263.5" y1="581.4531" y2="581.4531"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14" x="97.5" y="576.5967">10</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137" x="115.5" y="576.5967">public page / login page</text><path d="M194,594.4531 L194,653.4531 L1345,653.4531 L1345,604.4531 L1335,594.4531 L194,594.4531 " fill="#FEFFDD" filter="url(#fjt8whjqe394i)" style="stroke:#181818;stroke-width:0.5;"/><path d="M1335,594.4531 L1335,604.4531 L1345,604.4531 L1335,594.4531 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="463" x="487.75" y="612.9482">Google is NOT called: logout ends the LaPrizza application session only (AC 7).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="552" x="487.75" y="629.2998">LaPrizza never stored Google access or refresh tokens, so there is nothing to revoke at Google.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="327" x="487.75" y="645.6514">The user's Google session in the browser is not affected.</text><!--SRC=[RLLDRnCn4BtlhnZrGY8r2LH8I04XXHOG4j2AbbilpdgIc3ZsOdiJog_dZNStCO5SilREl7dpvcDLcxnhTqiELTmQrwYWTXGtIlk3SMjAeUNYHU3OU1Vv2yUerloEhJyiGl27ph1A9bccU_xPigkPRenQYzk45eldL_JPhtsRoAz8ENh_At5mojedMhHfmowPMYNMz3roe5541ECTxRZUA6VYZlp1uUtoIR1UZgjArSc7pbf5klWNvD6DebcBat5qC6b37xrVMnvVLCW6bgPHBj7ztI83oF_eG_0kJTuxVMRq3SGv7WDrnxzDvFw3iQdWyyLeRVcW0eFBdeDPFJtuBRipy6l43DxQmlDqTKQsboKJxf-Dsojhj4eu88x80yMJfoMJvaw2iuYT41cbV_oaHRpqX0XXRsgEGBhzT7DDTy7lZUO0X2gBFNcR9PjJRKsz1GBAIj3ZGYfYzf1VtbTY0zDUk3dTtTu_q4mrPhP_CLD8SMPpEpmwoTS7ypidCATt3Bq2lVbnI6zFa1rErSC1k91xJeMsey0_BwLHBydnhpG-GPmygi9vKf8KZz6OI42chMGB86_t4B3I_3-a4w6YYdFgSZjoALYSpAh2GqJjopadTfhGp5It8Q0gf9h6Ib_Bstuk2gtx2-Tn26QzoGCst19-DxmonUZGYAVhAVe3Oe7RtlV8isoCd27c9ABaGomOxJnQR7n9qMTY8CYwD-zCQkL0G3ekC7JJKtg0tGhhWKmaexl9jDbdXR6rY6f9UlN56Dj03nqfDrVZ0JPEAz52Kgi6UIRdKljjMPeXyLBROyTU8VklFhk3KEbMLAMuxPjkwEKEH9jOgw1x0OLxhUeDz6q2UDQoVJ2BwlMZG-4voI1-R3cc3WKmUOhcrBHBL9KQx56QISDWIydXhsmmI5rbFQeYnyjUgQnaBneK_dhx01hWhuVUaoB5NAtFwWxJzLlzhu_8EopWqUAQNesd6VDexLX2HYnPFfP7rTWCaRpCnGhfRJeLuj0P8PC1uKt-UFZSNrlu3IkdYo6z8TFrB0x0yRZBCkKbFYcYKWT6QhNAmXRjy0S0]--></g></svg>