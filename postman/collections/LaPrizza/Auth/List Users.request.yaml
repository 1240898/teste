$kind: http-request
url: http://localhost:8080/api/v1/users
method: GET
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
scripts:
  - type: afterResponse
    code: |
      pm.test('Manager cannot list user accounts', function () {
          pm.response.to.have.status(403);
      });
    language: text/javascript
order: 4000
