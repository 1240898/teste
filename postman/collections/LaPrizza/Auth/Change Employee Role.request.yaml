$kind: http-request
url: http://localhost:8080/api/v1/users/USR-00002/roles
method: PATCH
body:
  type: json
  content: |-
    {
        "roles": ["EMPLOYEE"]
    }
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
scripts:
  - type: afterResponse
    code: |
      pm.test('Manager cannot change user roles', function () {
          pm.response.to.have.status(403);
      });
    language: text/javascript
order: 3000
