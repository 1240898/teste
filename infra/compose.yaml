services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${PGDATABASE:?Set PGDATABASE}
      POSTGRES_USER: ${PGUSER:?Set PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres18_data:
