# SYS02 - Institutional network access restriction
# The list of approved networks is kept on the server, outside the image,
# and mounted into the container at /etc/nginx/access/ (see deploy/docker-compose.yml).
geo $remote_addr $sys02_allowed {
    default 0;
    include /etc/nginx/access/allowed-networks.conf;
}

# 1 when the client is not in an approved network; used to log denied requests only.
map $sys02_allowed $sys02_denied {
    0       1;
    default 0;
}

# Denied-request record. The query string and cookies are not logged.
# "via" is the address that connected to Nginx (the DEI gateway when the
# request was forwarded; the client itself otherwise).
log_format sys02_denied '$time_iso8601 client=$remote_addr via=$realip_remote_addr '
                        'method=$request_method uri="$uri" status=$status '
                        'user_agent="$http_user_agent"';

# HTTP - container port 8080, VM port 2228.
# The DEI gateway (vs-gate) forwards external requests here over HTTP, so SYS02
# keeps denying and logging them. Approved clients are redirected to HTTPS,
# the only address the application uses.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/sys02/denied.log sys02_denied if=$sys02_denied;

    # SYS02: for the trusted proxies listed on the server only, the real client
    # address is taken from the last X-Forwarded-For entry, which the gateway
    # itself appends; the network restriction then applies to that address.
    include /etc/nginx/access/trusted-proxies.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # SYS02: only approved networks reach the application.
    if ($sys02_allowed = 0) {
        return 403;
    }

    # 2229 is the VM port published for container port 8443 (deploy/docker-compose.yml).
    return 301 https://$host:2229$request_uri;
}

# HTTPS - container port 8443, VM port 2229.
# Clients connect directly from the DEI network or VPN (no proxy in front),
# so $remote_addr is already the client address.
# The certificate and key are kept on the VM and mounted at /etc/nginx/tls/.
server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/laprizza.crt;
    ssl_certificate_key /etc/nginx/tls/laprizza.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:laprizza_tls:1m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/sys02/denied.log sys02_denied if=$sys02_denied;

    # SYS02: only approved networks reach the application.
    if ($sys02_allowed = 0) {
        return 403;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api/v1 {
        return 308 /api/v1/;
    }

    location ^~ /api/v1/ {
        client_max_body_size 10m;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
