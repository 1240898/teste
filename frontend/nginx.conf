# SYS02 - Institutional network access restriction
# The list of approved networks is kept on the server, outside the image,
# and mounted into the container at /etc/nginx/access/ (see deploy/docker-compose.yml).
geo $remote_addr $sys02_allowed {
    default 0;
    include /etc/nginx/access/allowed-networks.conf;
}

# 1 when the client is not in an approved network; used to log denied requests only.
map $sys02_allowed $sys02_denied {
    0       1;
    default 0;
}

# Denied-request record. The query string and cookies are not logged.
log_format sys02_denied '$time_iso8601 client=$remote_addr method=$request_method '
                        'uri="$uri" status=$status user_agent="$http_user_agent"';

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Normal access log (container output) plus the SYS02 denied-access log.
    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/sys02/denied.log sys02_denied if=$sys02_denied;

    # SYS02: only approved networks reach the application.
    if ($sys02_allowed = 0) {
        return 403;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api/v1 {
        return 308 /api/v1/;
    }

    location ^~ /api/v1/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
